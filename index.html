<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カラオケビンゴ</title>
<meta name="description" content="87〜96点の抽選で3×3のカードを作り、その点数をカラオケで出せたらマスを開けるビンゴ。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="カラオケビンゴ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E0B16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:title" content="カラオケビンゴ">
<meta property="og:description" content="点数を引いて、カラオケで出せたらマスを開ける。3×3のビンゴ。">
<meta property="og:image" content="icon-512.png">
<style>
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
  body{margin:0;font-family:system-ui,sans-serif;background:#0E0B16}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;500;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700;900&amp;display=swap">
<style>
  :root{
    --ground:#0E0B16;
    --room:#161122;
    --panel:#1E1830;
    --panel-hi:#271F3D;
    --line:#332A4A;
    --ink:#F4EEFB;
    --ink-dim:#A99BC0;
    --ink-faint:#6F6488;
    --neon:#FF3D8A;
    --neon-ink:#FFC2D8;
    --neon-soft:rgba(255,61,138,.20);
    --gold:#FFC64B;
    --gold-soft:rgba(255,198,75,.14);
    --aqua:#54E6DC;
    --aqua-soft:rgba(84,230,220,.13);
    --r-cell:15px;
    color-scheme:dark;
  }
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(90% 55% at 50% -8%, rgba(255,61,138,.16), transparent 68%),
      radial-gradient(70% 45% at 8% 104%, rgba(84,230,220,.10), transparent 70%),
      var(--ground);
    background-attachment:fixed;
    color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit;background:none;border:0;padding:0;touch-action:manipulation}
  :focus-visible{outline:2px solid var(--aqua);outline-offset:3px;border-radius:6px}

  .app{
    max-width:430px;
    margin-inline:auto;
    padding-inline:18px;
    padding-block:16px 30px;
    min-height:100%;
    display:flex;
    flex-direction:column;
    gap:16px;
    box-sizing:border-box;
  }

  /* ---- header ---- */
  .masthead{display:flex;align-items:center;justify-content:space-between;gap:10px}
  h1{
    margin:0;
    font-size:21px;
    font-weight:900;
    letter-spacing:.02em;
  }
  h1 .mark{color:var(--neon)}
  .mute{
    flex:none;
    width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);
    border-radius:50%;
    color:var(--ink-dim);
    cursor:pointer;
    transition:color .2s,border-color .2s;
  }
  .mute .slash{display:none}
  .mute.off{color:var(--ink-faint)}
  .mute.off .wave{display:none}
  .mute.off .slash{display:inline}
  .mute:active{transform:scale(.94)}

  /* ---- phase rail ---- */
  .rail{display:flex;gap:7px}
  .seg{
    flex:1;
    min-height:44px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(255,255,255,.015);
    color:var(--ink-faint);
    font-size:13px;font-weight:700;letter-spacing:.10em;
    transition:background .25s,color .25s,border-color .25s,box-shadow .25s;
  }
  .seg.on{
    background:var(--neon);
    border-color:transparent;
    color:#1A0410;
    box-shadow:0 0 22px var(--neon-soft);
  }
  .seg-btn{
    border-color:rgba(255,61,138,.45);
    color:var(--neon-ink);
    cursor:pointer;
  }
  .seg-btn:active{transform:scale(.97)}

  /* ---- hint ---- */
  .hint{
    margin:0;
    min-height:2.9em;
    font-size:13.5px;
    line-height:1.55;
    color:var(--ink-dim);
    line-break:strict;
    word-break:normal;
    overflow-wrap:break-word;
  }
  .hint b{color:var(--ink);font-weight:700;white-space:nowrap}
  .hint .lines{color:var(--aqua);font-weight:700;white-space:nowrap}

  /* ---- board ---- */
  .board{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
  }
  .cell{
    position:relative;
    aspect-ratio:1;
    max-width:100%;
    border:1px solid var(--line);
    border-radius:var(--r-cell);
    background:linear-gradient(170deg,var(--panel-hi),var(--panel));
    display:grid;place-items:center;
    color:var(--ink-dim);
    transition:border-color .2s,background .3s,box-shadow .3s,transform .12s;
  }
  .cell .n{
    font-family:Antonio,"Zen Kaku Gothic New",sans-serif;
    font-weight:600;
    font-size:clamp(30px,10.5vw,46px);
    line-height:1;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
    display:flex;align-items:baseline;
  }
  .cell .unit{font-size:.36em;margin-left:.1em;font-weight:400;color:var(--ink-faint)}
  .cell.is-empty .n{
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-size:15px;font-weight:500;letter-spacing:.06em;
    color:var(--ink-faint);
  }
  .cell.tappable{cursor:pointer;border-color:rgba(255,61,138,.38)}
  .cell.tappable.is-empty .n{color:var(--neon-ink)}
  .cell.tappable:active{transform:scale(.96)}
  .cell.spin{
    border-color:var(--neon);
    box-shadow:0 0 26px var(--neon-soft),inset 0 0 20px var(--neon-soft);
  }
  .cell.spin .n{color:var(--neon-ink)}
  .cell.locked{opacity:.85}

  .cell.open{background:linear-gradient(170deg,var(--gold-soft),rgba(255,198,75,.05));border-color:rgba(255,198,75,.45)}
  .cell.open .n{color:var(--gold)}
  .cell.open .unit{color:rgba(255,198,75,.6)}
  .cell.open::before{
    content:"";
    position:absolute;
    width:78%;height:78%;
    border:3px solid var(--gold);
    border-radius:50%;
    opacity:.75;
  }
  .cell.pop::before{animation:stamp .42s cubic-bezier(.18,1.6,.45,1) both}
  .cell.pop{animation:punch .42s cubic-bezier(.2,1.4,.4,1) both}
  .cell.pop::after{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:var(--r-cell);
    border:2px solid var(--gold);
    animation:ripple .62s ease-out both;
  }
  .cell.cheer{animation:cheer .55s ease-in-out 3}
  .cell.in-line{border-color:var(--aqua);box-shadow:0 0 0 1px var(--aqua),0 0 20px var(--aqua-soft)}
  .cell.in-line::before{border-color:var(--aqua);opacity:.9}
  .cell.in-line .n{color:var(--aqua)}
  .cell.in-line .unit{color:rgba(84,230,220,.6)}
  @keyframes stamp{from{transform:scale(1.55);opacity:0}to{transform:scale(1);opacity:.75}}
  @keyframes punch{0%{transform:scale(1)}40%{transform:scale(1.09)}100%{transform:scale(1)}}
  @keyframes ripple{from{transform:scale(1);opacity:.9}to{transform:scale(1.5);opacity:0}}
  @keyframes cheer{
    0%,100%{box-shadow:0 0 0 1px var(--aqua),0 0 20px var(--aqua-soft)}
    50%{box-shadow:0 0 0 2px var(--aqua),0 0 34px rgba(84,230,220,.55)}
  }

  /* ---- number pool ---- */
  .pool{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:9px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    font-family:Antonio,sans-serif;
    font-size:15px;font-weight:500;
    font-variant-numeric:tabular-nums;
    padding:5px 9px 4px;
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--ink);
  }
  .chip.used{color:var(--ink-faint);border-color:transparent;background:rgba(255,255,255,.03);text-decoration:line-through;text-decoration-color:var(--neon)}
  .chip.spare{color:var(--aqua);border-color:rgba(84,230,220,.45)}

  /* ---- celebration ---- */
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:45}
  .flash{
    position:fixed;inset:0;z-index:46;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    pointer-events:none;
    opacity:1;
    transition:opacity .42s ease;
  }
  .flash.out{opacity:0}
  .flash .big{
    font-family:Antonio,"Zen Kaku Gothic New",sans-serif;
    font-size:clamp(58px,21vw,104px);
    font-weight:700;line-height:.86;letter-spacing:.03em;
    transform:skewX(-7deg);
    color:var(--aqua);
    text-shadow:0 0 16px rgba(84,230,220,.6),0 0 52px rgba(84,230,220,.32);
    animation:burstin .46s cubic-bezier(.15,1.7,.4,1) both;
  }
  .flash .sub{
    font-size:12px;font-weight:700;letter-spacing:.34em;
    color:var(--ink);
    text-shadow:0 2px 10px rgba(0,0,0,.7);
    animation:burstin .46s cubic-bezier(.15,1.7,.4,1) .08s both;
  }
  .flash.gold .big{color:var(--gold);text-shadow:0 0 16px rgba(255,198,75,.6),0 0 52px rgba(255,198,75,.3)}
  @keyframes burstin{from{transform:skewX(-7deg) scale(.55);opacity:0}to{transform:skewX(-7deg) scale(1);opacity:1}}

  /* ---- sheets ---- */
  .veil{
    position:fixed;inset:0;z-index:40;
    background:rgba(7,4,13,.76);
    -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
    box-sizing:border-box;
    animation:fade .18s ease both;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{
    width:100%;max-width:340px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:22px 20px 20px;
    box-sizing:border-box;
    display:flex;flex-direction:column;gap:14px;
    box-shadow:0 24px 60px rgba(0,0,0,.6);
    animation:rise .22s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes rise{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .sheet h2{margin:0;font-size:16px;font-weight:900;letter-spacing:.02em}
  .sheet p{margin:0;font-size:13px;line-height:1.6;color:var(--ink-dim)}
  .bigscore{
    font-family:Antonio,sans-serif;
    font-size:64px;font-weight:600;line-height:.95;
    color:var(--gold);
    text-align:center;
    font-variant-numeric:tabular-nums;
    padding-block:4px;
  }
  .bigscore span{font-size:.3em;color:var(--ink-dim);margin-left:.1em}
  .btn{
    min-height:48px;
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;letter-spacing:.03em;
    cursor:pointer;
    transition:transform .12s,filter .2s;
  }
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--neon);color:#1A0410}
  .btn-gold{background:var(--gold);color:#2A1A00}
  .btn-ghost{border:1px solid var(--line);color:var(--ink-dim)}
  .picks{display:flex;gap:10px}
  .pick{
    flex:1;
    min-height:92px;
    border:1px solid rgba(84,230,220,.4);
    border-radius:14px;
    background:rgba(84,230,220,.06);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;
    font-family:Antonio,sans-serif;
    font-size:40px;font-weight:600;
    color:var(--aqua);
    font-variant-numeric:tabular-nums;
    transition:transform .12s,background .2s;
  }
  .pick:active{transform:scale(.97);background:rgba(84,230,220,.14)}
  .tally{display:flex;gap:10px}
  .tally div{
    flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 10px;
    display:flex;flex-direction:column;gap:4px;align-items:center;
  }
  .tally b{font-family:Antonio,sans-serif;font-size:30px;font-weight:600;line-height:1}
  .tally b.gold{color:var(--gold)}
  .tally b.aqua{color:var(--aqua)}
  .tally small{font-size:10px;letter-spacing:.14em;color:var(--ink-faint)}

  @media (prefers-reduced-motion:reduce){
    *,*::before{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }
</style>

</head>
<body>
<main class="app">
  <div class="masthead">
    <h1>カラオケ<span class="mark">ビンゴ</span></h1>
    <button class="mute" id="mute" type="button" aria-pressed="false" aria-label="音を消す">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M4 9.4h3.3L12 5.4v13.2L7.3 14.6H4z" fill="currentColor" stroke="none"></path>
        <path class="wave" d="M15.4 9.3a4 4 0 0 1 0 5.4"></path>
        <path class="wave" d="M18.1 6.9a7.6 7.6 0 0 1 0 10.2"></path>
        <path class="slash" d="M15.6 9.6l5 4.8m0-4.8l-5 4.8"></path>
      </svg>
    </button>
  </div>

  <div class="rail" role="group" aria-label="フェーズ">
    <div class="seg" id="segCreate" aria-current="false">作成中</div>
    <div class="seg" id="segBingo" aria-current="false">ビンゴ中</div>
    <button class="seg seg-btn" id="segReset" type="button">リセット</button>
  </div>

  <p class="hint" id="hint"></p>

  <div class="board" id="board" role="grid" aria-label="ビンゴカード"></div>

  <section class="pool">
    <div class="chips" id="chips"></div>
  </section>

</main>

<canvas id="fx" aria-hidden="true"></canvas>

<div class="flash" id="flash" hidden aria-hidden="true">
  <div class="big" id="flashBig">BINGO!</div>
  <div class="sub" id="flashSub"></div>
</div>

<div class="veil" id="veilOpen" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="openTitle">
    <h2 id="openTitle">このマスを開けますか？</h2>
    <div class="bigscore" id="openScore">—<span>点</span></div>
    <p id="openBody">この点数が出たら開けられます。開けたマスは元に戻せません。</p>
    <button class="btn btn-gold" id="openYes" type="button">開ける</button>
    <button class="btn btn-ghost" id="openNo" type="button">やめる</button>
  </div>
</div>

<div class="veil" id="veilCenter" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="centerTitle">
    <h2 id="centerTitle">真ん中の点数を選ぶ</h2>
    <p>8マスの抽選で残った2つです。選ばなかった方は、このカードでは出番なしになります。</p>
    <div class="picks" id="picks"></div>
    <button class="btn btn-ghost" id="centerLater" type="button">あとで</button>
  </div>
</div>

<div class="veil" id="veilFinish" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="finishTitle">
    <h2 id="finishTitle">リセットしてもよろしいですか？</h2>
    <div class="tally">
      <div><b class="gold" id="tallyOpen">0</b><small>開いたマス</small></div>
      <div><b class="aqua" id="tallyLines">0</b><small>ビンゴ</small></div>
    </div>
    <p>リセットするとカードは白紙になり、作成フェーズからやり直します。</p>
    <button class="btn btn-primary" id="finishReset" type="button">リセットする</button>
    <button class="btn btn-ghost" id="finishBack" type="button">キャンセル</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var SCORES=[87,88,89,90,91,92,93,94,95,96];
  var CENTER=4;
  var KEY="karaoke-bingo-3x3-v1";
  var LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  var S=fresh();
  var busy=false;
  var pendingOpen=null;
  var fxPop=-1;
  var fxCheer={};

  var el={
    board:document.getElementById("board"),
    hint:document.getElementById("hint"),
    chips:document.getElementById("chips"),
    segCreate:document.getElementById("segCreate"),
    segBingo:document.getElementById("segBingo"),
    segReset:document.getElementById("segReset"),
    veilOpen:document.getElementById("veilOpen"),
    openScore:document.getElementById("openScore"),
    veilCenter:document.getElementById("veilCenter"),
    picks:document.getElementById("picks"),
    veilFinish:document.getElementById("veilFinish"),
    tallyOpen:document.getElementById("tallyOpen"),
    tallyLines:document.getElementById("tallyLines"),
    mute:document.getElementById("mute"),
    fx:document.getElementById("fx"),
    flash:document.getElementById("flash"),
    flashBig:document.getElementById("flashBig"),
    flashSub:document.getElementById("flashSub")
  };

  var GOLD=["#FFC64B","#FFE2A0","#FF9F1C"];
  var PARTY=["#54E6DC","#FFC64B","#FF3D8A","#F4EEFB"];
  var reduced=false;
  try{ reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}

  /* ---------- sound ---------- */
  var MKEY="karaoke-bingo-mute";
  var muted=false;
  try{ muted=localStorage.getItem(MKEY)==="1"; }catch(e){}
  var actx=null;

  function ac(){
    if(muted) return null;
    try{
      if(!actx){
        var AC=window.AudioContext||window.webkitAudioContext;
        if(!AC) return null;
        actx=new AC();
      }
      if(actx.state==="suspended"&&actx.resume) actx.resume();
      return actx;
    }catch(e){ return null; }
  }
  // one note: frequency, start offset, length, waveform, peak level
  function note(f,at,len,type,vol,slideTo){
    var c=ac(); if(!c) return;
    var t=c.currentTime+at;
    var o=c.createOscillator(), g=c.createGain();
    o.type=type||"triangle";
    o.frequency.setValueAtTime(f,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+len);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+Math.min(0.012,len*0.25));
    g.gain.exponentialRampToValueAtTime(0.0001,t+len);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t+len+0.03);
  }
  function chord(list,at,len,type,vol){
    for(var i=0;i<list.length;i++) note(list[i],at,len,type,vol);
  }
  // roulette: a dry click per step
  function sfxTick(){ note(1150,0,0.022,"square",0.035); }
  // roulette lands on a number
  function sfxSettle(){ note(660,0,0.09,"triangle",0.12,990); note(1320,0.07,0.16,"sine",0.07); }
  // a square opens: bright three-note sparkle
  function sfxOpen(){
    note(1046.5,0,0.11,"sine",0.13);
    note(1318.5,0.06,0.11,"sine",0.12);
    note(1568,0.12,0.24,"sine",0.13);
    note(2093,0.16,0.3,"sine",0.045);
  }
  // bingo: rising fanfare over a low root
  function sfxBingo(){
    note(196,0,0.5,"sawtooth",0.045);
    var n=[784,987.8,1174.7,1568];
    for(var i=0;i<n.length;i++) note(n[i],i*0.075,0.3,"triangle",0.12);
    chord([1568,1975.5],0.34,0.55,"sine",0.07);
  }
  // all nine open
  function sfxComplete(){
    var n=[523.3,659.3,784,1046.5,1318.5,1568];
    for(var i=0;i<n.length;i++) note(n[i],i*0.085,0.35,"triangle",0.12);
    note(130.8,0.5,0.7,"sawtooth",0.05);
    chord([1046.5,1318.5,1568,2093],0.55,0.9,"sine",0.075);
  }

  function paintMute(){
    el.mute.classList.toggle("off",muted);
    el.mute.setAttribute("aria-pressed",muted?"true":"false");
    el.mute.setAttribute("aria-label",muted?"音を出す":"音を消す");
  }
  el.mute.addEventListener("click",function(){
    muted=!muted;
    try{ localStorage.setItem(MKEY,muted?"1":"0"); }catch(e){}
    paintMute();
    if(!muted) note(880,0,0.08,"sine",0.1);
  });
  paintMute();

  /* ---------- confetti ---------- */
  var ctx=null,parts=[],raf=0,dpr=1;
  function fitFx(){
    if(!ctx) return;
    dpr=Math.min(2,window.devicePixelRatio||1);
    el.fx.width=Math.floor(window.innerWidth*dpr);
    el.fx.height=Math.floor(window.innerHeight*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  try{ ctx=el.fx.getContext("2d"); fitFx(); }catch(e){ ctx=null; }
  window.addEventListener("resize",fitFx);

  function emit(x,y,n,colors,power,fall){
    if(!ctx||reduced) return;
    for(var i=0;i<n;i++){
      var a=Math.random()*Math.PI*2;
      var sp=power*(0.35+Math.random()*0.9);
      parts.push({
        x:x,y:y,
        vx:Math.cos(a)*sp,
        vy:Math.sin(a)*sp-power*0.35,
        g:fall?0.22:0.32,
        w:3+Math.random()*5,
        h:5+Math.random()*8,
        rot:Math.random()*Math.PI,
        vr:(Math.random()-0.5)*0.34,
        col:colors[(Math.random()*colors.length)|0],
        life:1
      });
    }
    if(parts.length>220) parts.splice(0,parts.length-220);
    if(!raf) raf=requestAnimationFrame(step);
  }
  function step(){
    raf=0;
    if(!ctx) return;
    ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];
      p.vy+=p.g; p.vx*=0.988; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      p.life-=0.0075;
      if(p.life<=0||p.y>window.innerHeight+40){ parts.splice(i,1); continue; }
      ctx.save();
      ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.6));
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle=p.col;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    }
    if(parts.length) raf=requestAnimationFrame(step);
    else ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  }
  function burstAt(node,colors,n,power){
    if(!node||!node.getBoundingClientRect) return;
    var r=node.getBoundingClientRect();
    emit(r.left+r.width/2,r.top+r.height/2,n,colors,power,false);
  }

  /* ---------- banner ---------- */
  var flashTimers=[];
  function showFlash(big,sub,gold,hold){
    flashTimers.forEach(clearTimeout); flashTimers=[];
    el.flashBig.textContent=big;
    el.flashSub.textContent=sub;
    el.flash.classList.toggle("gold",!!gold);
    el.flash.classList.remove("out");
    el.flash.hidden=false;
    // restart the entrance animation
    el.flashBig.style.animation="none";
    el.flashSub.style.animation="none";
    void el.flashBig.offsetWidth;
    el.flashBig.style.animation="";
    el.flashSub.style.animation="";
    flashTimers.push(setTimeout(function(){ el.flash.classList.add("out"); },hold));
    flashTimers.push(setTimeout(function(){ el.flash.hidden=true; },hold+450));
  }
  function clearFx(){
    parts=[];
    if(ctx) ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    flashTimers.forEach(clearTimeout); flashTimers=[];
    el.flash.hidden=true;
  }

  function fresh(){
    var cells=[];
    for(var i=0;i<9;i++) cells.push({score:null,open:false});
    return {phase:"create",cells:cells,prev:null};
  }
  function valid(s){
    if(!s||typeof s!=="object") return null;
    if(!Array.isArray(s.cells)||s.cells.length!==9) return null;
    if(["create","bingo","finish"].indexOf(s.phase)<0) return null;
    for(var i=0;i<9;i++){
      var c=s.cells[i];
      if(!c||typeof c!=="object") return null;
      if(c.score!==null&&SCORES.indexOf(c.score)<0) return null;
      c.open=!!c.open;
    }
    return s;
  }
  function save(){
    try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
  }
  function load(){
    try{
      var raw=localStorage.getItem(KEY);
      return raw?valid(JSON.parse(raw)):null;
    }catch(e){ return null; }
  }

  function used(){
    var u=[];
    for(var i=0;i<9;i++) if(S.cells[i].score!==null) u.push(S.cells[i].score);
    return u;
  }
  function pool(){
    var u=used();
    return SCORES.filter(function(s){ return u.indexOf(s)<0; });
  }
  function outerFilled(){
    var n=0;
    for(var i=0;i<9;i++) if(i!==CENTER&&S.cells[i].score!==null) n++;
    return n;
  }
  function openCount(){
    var n=0;
    for(var i=0;i<9;i++) if(S.cells[i].open) n++;
    return n;
  }
  function litCells(){
    var set={},n=0;
    LINES.forEach(function(L){
      if(S.cells[L[0]].open&&S.cells[L[1]].open&&S.cells[L[2]].open){
        n++; L.forEach(function(i){ set[i]=true; });
      }
    });
    return {set:set,count:n};
  }

  /* ---------- render ---------- */
  function render(){
    var lit=litCells();
    var tappable=[];

    el.segCreate.classList.toggle("on",S.phase==="create");
    el.segBingo.classList.toggle("on",S.phase==="bingo");
    el.segReset.classList.toggle("on",S.phase==="finish");
    el.segCreate.setAttribute("aria-current",S.phase==="create");
    el.segBingo.setAttribute("aria-current",S.phase==="bingo");

    el.board.innerHTML="";
    for(var i=0;i<9;i++){
      (function(i){
        var c=S.cells[i];
        var b=document.createElement("button");
        b.type="button";
        b.className="cell";
        b.dataset.i=i;
        var can=false;
        if(S.phase==="create"){
          if(i===CENTER) can=(c.score===null&&outerFilled()===8);
          else can=(c.score===null);
        }else if(S.phase==="bingo"){
          can=!c.open;
        }
        var n=document.createElement("span");
        n.className="n";
        if(c.score===null){
          b.classList.add("is-empty");
          n.textContent=(i===CENTER&&outerFilled()<8)?"":"タップ";
          b.setAttribute("aria-label",(i===CENTER?"中央":"")+"未設定のマス");
        }else{
          n.textContent=String(c.score);
          var u=document.createElement("span");
          u.className="unit"; u.textContent="点";
          n.appendChild(u);
          b.setAttribute("aria-label",c.score+"点 "+(c.open?"クリア済み":"未クリア"));
        }
        if(c.open) b.classList.add("open");
        if(c.open&&i===fxPop) b.classList.add("pop");
        if(lit.set[i]) b.classList.add("in-line");
        if(lit.set[i]&&fxCheer[i]) b.classList.add("cheer");
        if(can){ b.classList.add("tappable"); tappable.push(i); }
        else { b.classList.add("locked"); b.disabled=true; }
        b.appendChild(n);
        b.addEventListener("click",function(){ onCell(i); });
        el.board.appendChild(b);
      })(i);
    }

    var p=pool();
    el.chips.innerHTML="";
    var list=(S.phase==="create")?SCORES:p;
    list.forEach(function(s){
      var d=document.createElement("span");
      d.className="chip";
      if(S.phase==="create"){ if(used().indexOf(s)>=0) d.className+=" used"; }
      else d.className+=" spare";
      d.textContent=s;
      el.chips.appendChild(d);
    });

    el.hint.innerHTML=hintText(lit.count);
    el.veilFinish.hidden=(S.phase!=="finish");
    if(S.phase==="finish"){
      el.tallyOpen.textContent=openCount();
      el.tallyLines.textContent=lit.count;
    }
  }

  function hintText(lines){
    if(S.phase==="create"){
      var f=outerFilled();
      if(f<8) return "マスをタップすると<b>87〜96点</b>のルーレットが回ります。<br>残り<b>"+(8-f)+"マス</b>。";
      if(S.cells[CENTER].score===null) return "真ん中のマスをタップして、<b>残り2つ</b>から点数を選んでください。";
      return "カードが完成しました。";
    }
    if(S.phase==="bingo"){
      var o=openCount();
      if(o===9) return "<b>全マスクリア！</b>お疲れさま。リセットで次のカードへ。";
      var head=(lines>0)?"<span class='lines'>ビンゴ"+lines+"列</span>／":"";
      return head+"その点数が出たらマスをタップ。あと<b>"+(9-o)+"マス</b>。";
    }
    return "リセットの確認中です。";
  }

  /* ---------- interactions ---------- */
  function onCell(i){
    if(busy||S.phase==="finish") return;
    var c=S.cells[i];
    if(S.phase==="create"){
      if(i===CENTER){
        if(c.score===null&&outerFilled()===8) showCenter();
        return;
      }
      if(c.score!==null) return;
      spin(i);
    }else if(S.phase==="bingo"){
      if(c.open) return;
      pendingOpen=i;
      el.openScore.innerHTML=c.score+"<span>点</span>";
      el.veilOpen.hidden=false;
      document.getElementById("openYes").focus();
    }
  }

  function spin(i){
    var p=pool();
    if(!p.length) return;
    busy=true;
    var final=p[Math.floor(Math.random()*p.length)];
    var cell=el.board.children[i];
    cell.classList.remove("is-empty");
    cell.classList.add("spin");
    var nEl=cell.querySelector(".n");
    nEl.textContent="";
    var num=document.createTextNode("");
    var unit=document.createElement("span");
    unit.className="unit"; unit.textContent="点";
    nEl.appendChild(num); nEl.appendChild(unit);

    var reduced=false;
    try{ reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
    var steps=reduced?3:Math.max(18,p.length*3);
    var k=Math.floor(Math.random()*p.length);
    var t=0;

    function tick(){
      if(t>=steps){
        num.nodeValue=String(final);
        sfxSettle();
        cell.classList.remove("spin");
        S.cells[i].score=final;
        save();
        render();
        busy=false;
        if(outerFilled()===8&&S.cells[CENTER].score===null){
          setTimeout(showCenter,420);
        }
        return;
      }
      num.nodeValue=String(p[k%p.length]);
      sfxTick();
      k++; t++;
      var prog=t/steps;
      var delay=reduced?90:(38+Math.pow(prog,3)*230);
      setTimeout(tick,delay);
    }
    tick();
  }

  function showCenter(){
    var p=pool();
    el.picks.innerHTML="";
    p.forEach(function(s){
      var b=document.createElement("button");
      b.type="button";
      b.className="pick";
      b.appendChild(document.createTextNode(String(s)));
      b.addEventListener("click",function(){ chooseCenter(s); });
      el.picks.appendChild(b);
    });
    el.veilCenter.hidden=false;
  }

  function chooseCenter(s){
    sfxSettle();
    S.cells[CENTER].score=s;
    S.phase="bingo";
    el.veilCenter.hidden=true;
    save();
    render();
  }

  document.getElementById("centerLater").addEventListener("click",function(){
    el.veilCenter.hidden=true;
  });

  document.getElementById("openYes").addEventListener("click",function(){
    var i=pendingOpen;
    pendingOpen=null;
    el.veilOpen.hidden=true;
    if(i===null){ render(); return; }

    var before=litCells();
    S.cells[i].open=true;
    save();
    var after=litCells();
    var gained=[];
    for(var k in after.set) if(!before.set[k]) gained.push(Number(k));

    fxPop=i;
    fxCheer={};
    gained.forEach(function(k){ fxCheer[k]=true; });
    render();
    fxPop=-1;
    fxCheer={};

    burstAt(el.board.children[i],GOLD,16,5.5);
    sfxOpen();

    var newLines=after.count-before.count;
    var done=(openCount()===9);
    if(newLines>0){
      emit(window.innerWidth/2,window.innerHeight*0.42,90,PARTY,8,true);
      setTimeout(sfxBingo,150);
      showFlash("BINGO!",newLines>1?(newLines+"列そろった"):(after.count+"列目"),false,1250);
      if(!reduced){
        setTimeout(function(){ emit(window.innerWidth*0.25,window.innerHeight*0.3,40,PARTY,7,true); },180);
        setTimeout(function(){ emit(window.innerWidth*0.75,window.innerHeight*0.3,40,PARTY,7,true); },330);
      }
    }
    if(done){
      setTimeout(function(){
        emit(window.innerWidth/2,window.innerHeight*0.45,120,PARTY.concat(GOLD),9,true);
        sfxComplete();
        showFlash("COMPLETE","全9マス制覇",true,1700);
      },newLines>0?1500:260);
    }
  });
  document.getElementById("openNo").addEventListener("click",function(){
    pendingOpen=null;
    el.veilOpen.hidden=true;
  });

  el.segReset.addEventListener("click",function(){
    if(busy||S.phase==="finish") return;
    el.veilOpen.hidden=true;
    el.veilCenter.hidden=true;
    pendingOpen=null;
    S.prev=S.phase;
    S.phase="finish";
    save();
    render();
  });
  document.getElementById("finishReset").addEventListener("click",function(){
    clearFx();
    S=fresh();
    save();
    render();
  });
  document.getElementById("finishBack").addEventListener("click",function(){
    S.phase=S.prev||"create";
    S.prev=null;
    save();
    render();
  });

  /* ---------- boot ---------- */
  function start(seed){
    var restored=load();
    if(!restored&&seed&&seed.S) restored=valid(seed.S);
    if(restored) S=restored;
    render();
  }
  try{
    if(window.claude&&window.claude.hot){
      if(window.claude.hot.snapshot) window.claude.hot.snapshot(function(){ return {S:S}; });
      if(window.claude.hot.ready){ window.claude.hot.ready(start); }
      else start(window.claude.hot.data||{});
    }else start({});
  }catch(e){ start({}); }
})();
</script>

</body>
